services:
  - type: web
    name: cortex-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: ""
    buildCommand: npm install && npm run build -w server
    startCommand: node server/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: "3001"
      - key: HOST
        value: "0.0.0.0"
      - key: DISABLE_AUTH
        value: "true"
      - key: ENCRYPTION_KEY
        value: "2ba22e53c2483c99d5df395b0c3ac2db98c920c43ed5dafa45017a9c8c0d4b55"
