services:
  - type: web
    name: cortex-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: ""
    buildCommand: npm install && npm run build -w server
    startCommand: node server/dist/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3001"
      - key: DISABLE_AUTH
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: ENCRYPTION_KEY
        sync: false
